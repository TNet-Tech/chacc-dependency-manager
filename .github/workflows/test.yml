name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # Python 3.9 is end of life and has no builds for the newest Ubuntu runner.
          - os: ubuntu-24.04
            python-version: '3.9'
          # Windows paths need their own run (backslashes, drive letters).
          - os: windows-latest
            python-version: '3.13'

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .

    - name: Run tests
      env:
        PYTHONPATH: src
      run: |
        python -m pytest tests/ -v